<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML & CSS Sandbox</title>
</head>

<body>
    <h1>HTML & CSS Sandbox - iframe</h1>

    <!-- Webpage -->
    <iframe src="./test.html" frameborder="0"></iframe>

    <!-- Videos -->
    <iframe src="https://youtube.com/embed/8sXRyHI3bLw" frameborder="0" width="500" height="315"></iframe>

    <iframe src="./invoicesample.pdf" frameborder="0" width="500" height="315"></iframe>

    <!-- Google Maps -->
    <iframe width="500" height="315" src="https://maps.google.com/maps?q=Dhaka,Bangladesh&output=embed">
    </iframe>

    <!-- Google Calender -->
    <iframe width="500" height="315"
        src="https://calendar.google.com/calendar/embed?height=600&wkst=1&ctz=Asia%2FDhaka">
    </iframe>

    <!-- embed  -->
    <embed src="https://youtube.com/embed/8sXRyHI3bLw" width="500" height="315">

    <!-- object -->
     <object data="https://youtube.com/embed/8sXRyHI3bLw" width="500" height="315"></object>

</body>

</html>
