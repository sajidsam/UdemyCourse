<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML & CSS Sandbox</title>
</head>

<body>
    <h1>HTML & CSS Sandbox - Line Break, Horizontal Rule & Entitites</h1>


    <!-- line Breaks  -->
    Hello <br> <br> <br>
    world


    <!-- Horizontal Rules -->
    <p>This is the first &nbsp;&nbsp;&nbsp; paragraph</p>
    <hr>
    <p>This is the second paragraph</p>
    <br>
    <p>Copyright &copy; 2024</p>

    <!-- Pre tag  -->
    <pre>
            Hello         world


            Hello
                Again
          </pre>
    <code>
            &lt;h1&gt; This is a heading &lt;/h1&gt;
    </code>

    <!-- Html entities -->

    <!-- - &gt; for >
        - &lt; for <
        - &amp; for &
        - &quot; for "
        - &apos; for '
        - &nbsp; for Non-breaking space
        - &copy; for o
        - &reg; for ®
        - &trade; for ™
        &deg; for e - -->

</body>

</html>
